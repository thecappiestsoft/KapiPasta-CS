name: Verify course content

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run every example, quiz, solution and WPF check
        run: node tools/build.js --check
      - name: Check that js/data/course.js is up to date
        run: |
          node tools/build.js
          git diff --exit-code js/data/course.js || (echo "::error::Run 'node tools/build.js' and commit js/data/course.js" && exit 1)
